name: Test

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'tests/**'
      - 'playwright.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test.yml'
  pull_request:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    # ベースライン画像を生成した環境と揃えるためタグを固定する
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright test
